version: '3.8'

services:
  # Built-in Dummy Target App (OAuth + REST API + Web UI)
  dummy-app:
    build: .
    command: npm run dummy-app
    ports:
      - "3000:3000"
    environment:
      - DUMMY_APP_PORT=3000

  # Test Management Dashboard (Backend + Frontend + AI Diagnostics)
  dashboard:
    build: .
    command: npm run dashboard
    ports:
      - "4000:4000"
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - USE_DUMMY_APP=true
      - DUMMY_APP_PORT=3000
      - DASHBOARD_PORT=4000

  # Service to run Backend API & Integration tests
  tests-backend:
    build: .
    command: npm run test:backend
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - USE_DUMMY_APP=true

  # Service to run Frontend Cypress E2E tests in headless mode
  tests-e2e:
    build: .
    depends_on:
      - dummy-app
    command: npm run test:e2e:headless
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CYPRESS_BASE_URL=http://dummy-app:3000
      - CYPRESS_USERNAME=admin
      - CYPRESS_PASSWORD=password
